<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atiq SMM Panel V5 Ultra</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>
<script type="module" src="payment.js"></script>
<script type="module" src="services.js"></script>

</head>

<body>

<!-- HEADER -->
<header class="topbar">

<div class="logo-area">

<h1>Atiq SMM</h1>

<span class="badge">V5 ULTRA</span>

</div>

<div class="right-box">

<div class="balance-card">

<small>Balance</small>

<h2 id="balance">৳ 0</h2>

</div>

<div class="avatar">
A
</div>

</div>

</header>

<!-- MAIN -->
<div class="container">

<!-- LEFT SIDE -->
<div class="left-side">

<!-- SERVICES -->
<div class="glass-card">

<h3>
<i class="fa-solid fa-layer-group"></i>
All Services
</h3>

<div id="serviceContainer"
class="service-grid">

</div>

</div>

<!-- HISTORY -->
<div class="glass-card">

<h3>
<i class="fa-solid fa-clock-rotate-left"></i>
Recent Orders
</h3>

<div class="history-item">
Facebook Followers - Pending
</div>

<div class="history-item">
YouTube Subscribers - Completed
</div>

</div>

</div>

<!-- RIGHT SIDE -->
<div class="right-side">

<!-- DEPOSIT -->
<div class="deposit-box">

<h3>
<i class="fa-solid fa-wallet"></i>
Quick Deposit
</h3>

<div class="number-box">
01763609391
</div>

<input
type="text"
id="trx"
placeholder="Transaction ID">

<input
type="number"
id="amount"
placeholder="Amount">

<button id="depositBtn">
Add Balance
</button>

</div>

<!-- LOGIN -->
<div class="glass-card login-card">

<h3>
<i class="fa-solid fa-user"></i>
Login / Register
</h3>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

<button id="registerBtn">
Create Account
</button>

</div>

<!-- SUPPORT -->
<div class="glass-card">

<h3>
<i class="fa-solid fa-headset"></i>
Live Support
</h3>

<p>
24/7 Support Available
</p>

<button class="support-btn">
Open Ticket
</button>

</div>

</div>

</div>

<!-- FOOTER -->
<footer class="footer">

<p>
© 2026 Atiq SMM Panel V5 Ultra
</p>

</footer>

</body>
</html>
